[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ce-edit"
dynamic = ["version"]
description = "A lightweight Notepad-style editor for Cheat Engine Lua and Auto Assembler scripts"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ce_edit contributors" }]
keywords = ["cheat-engine", "lua", "auto-assembler", "editor", "tkinter"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Environment :: X11 Applications",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Editors",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.gui-scripts]
ce-edit = "ce_edit.app:main"

[tool.hatch.version]
path = "ce_edit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["ce_edit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["gui: tests that need a Tk display"]

[tool.coverage.run]
source = ["ce_edit"]
omit = ["ce_edit/__main__.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
  # These suggestions would expand concise frozenset definitions and add
  # contextlib imports purely for uniformity; keep the existing style.
  "SIM905",
  "SIM105",
]
